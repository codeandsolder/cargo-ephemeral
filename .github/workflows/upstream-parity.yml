name: Upstream parity

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@1c9f5c8968c4caf8754c98ebeb0889d9e774b5ed # main
    with:
      upstream-repository: rust-lang/cargo
      upstream-branch: master
      target-branch: master
      strategy: squash-rebase
      workflow-policy: preserve
      rust-toolchain: "1.99.0"
      cargo-artifact: true
      timeout-minutes: 90
      validation-script: .github/scripts/validate-upstream.sh
