name: Shared sccache

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-check:
    name: Cargo check (shared sccache)
    permissions:
      contents: read
      id-token: write
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@main
    with:
      command: cargo +1.98.1 check --locked -p cargo
      rust-toolchain: "1.98.1"
      rustflags: "-C target-cpu=x86-64-v2"
